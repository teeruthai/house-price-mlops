<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ทำนายราคาบ้าน</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Noto Sans Thai", sans-serif; background: #f3f5f9;
           margin: 0; padding: 24px; color: #1f2937; }
    .card { max-width: 460px; margin: 0 auto; background: #fff; padding: 28px;
            border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: #6b7280; font-size: .9rem; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: .9rem; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
                    border-radius: 8px; font-size: 1rem; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px;
             background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    #result { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
    #result.ok { display: block; background: #ecfdf5; border: 1px solid #10b981; }
    #result.err { display: block; background: #fef2f2; border: 1px solid #ef4444; color: #b91c1c; }
    #price { font-size: 1.8rem; font-weight: 700; color: #047857; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏠 ทำนายราคาบ้าน</h1>
    <p class="sub">กรอกข้อมูลบ้านเพื่อประเมินราคา</p>

    <form id="form">
      <label for="area_sqm">พื้นที่ใช้สอย (ตร.ม.)</label>
      <input type="number" id="area_sqm" value="85" min="11" max="1999" step="any" required>

      <label for="bedrooms">จำนวนห้องนอน</label>
      <input type="number" id="bedrooms" value="2" min="1" max="10" required>

      <label for="bathrooms">จำนวนห้องน้ำ</label>
      <input type="number" id="bathrooms" value="1" min="1" max="10" required>

      <label for="age_years">อายุบ้าน (ปี)</label>
      <input type="number" id="age_years" value="5" min="0" max="100" required>

      <label for="location">ทำเล</label>
      <select id="location">
        <option value="city_center">ใจกลางเมือง</option>
        <option value="suburb">ชานเมือง</option>
        <option value="rural">ชนบท</option>
      </select>

      <button type="submit" id="btn">ทำนายราคา</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "กำลังคำนวณ...";
      result.className = "";

      const payload = {
        area_sqm: parseFloat(document.getElementById("area_sqm").value),
        bedrooms: parseInt(document.getElementById("bedrooms").value),
        bathrooms: parseInt(document.getElementById("bathrooms").value),
        age_years: parseInt(document.getElementById("age_years").value),
        location: document.getElementById("location").value,
      };

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          const msg = Array.isArray(data.detail)
            ? data.detail.map(d => `${d.loc.slice(-1)[0]}: ${d.msg}`).join("<br>")
            : (data.detail || "เกิดข้อผิดพลาด");
          throw new Error(msg);
        }
        result.className = "ok";
        result.innerHTML =
          `<small>ราคาที่ประเมิน</small><div id="price">${data.predicted_price.toLocaleString("th-TH")} ${data.currency}</div>` +
          `<small>โมเดล: ${data.model_name} (v${data.model_version})</small>`;
      } catch (err) {
        result.className = "err";
        result.innerHTML = "❌ " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "ทำนายราคา";
      }
    });
  </script>
</body>
</html>
